<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16">
        <animate attributeName="stop-color" values="#090d16;#0d1527;#060810;#090d16" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#1e1b4b;#0f172a;#111827" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#030712">
        <animate attributeName="stop-color" values="#030712;#090d16;#030712;#030712" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Aurora Glowing Gradients -->
    <radialGradient id="aurora1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ffffff"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#06b6d4;#6366f1" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#3b82f6;#ec4899;#a855f7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#6366f1;#a855f7;#06b6d4" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .mono-text { font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Courier New', monospace; }
    .sans-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
    
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-15px) scale(1.08); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(3deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    .floating-aurora1 { animation: float1 7s ease-in-out infinite; transform-origin: center; }
    .floating-aurora2 { animation: float2 9s ease-in-out infinite; transform-origin: center; }
    .pulsing-star { animation: pulse 3s ease-in-out infinite; }
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)"/>

  <!-- Dynamic Glowing Auroras -->
  <g class="floating-aurora1">
    <ellipse cx="250" cy="140" rx="320" ry="180" fill="url(#aurora1)" />
  </g>
  <g class="floating-aurora2">
    <ellipse cx="950" cy="280" rx="340" ry="200" fill="url(#aurora2)" />
  </g>
  <ellipse cx="600" cy="200" rx="280" ry="140" fill="url(#aurora3)" />

  <!-- Subtle Tech Grid Overlay -->
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>

  <!-- Outer Glowing Border Frame -->
  <rect x="2" y="2" width="1196" height="416" rx="22" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" opacity="0.85"/>

  <!-- Floating Animated Star Orbs -->
  <circle cx="140" cy="90" r="3" fill="#a5b4fc" class="pulsing-star">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="110" r="3.5" fill="#f472b6" class="pulsing-star">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="70" r="2.5" fill="#38bdf8" class="pulsing-star">
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="340" r="3" fill="#c084fc" class="pulsing-star">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="350" r="2" fill="#67e8f9" class="pulsing-star">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Category Tag Capsule at Top -->
  <g transform="translate(600, 75)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.95"/>
    <circle cx="-110" cy="0" r="5" fill="#22c55e">
      <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-95" y="5" class="mono-text" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="2">2026 VIRAL ECOSYSTEM</text>
  </g>

  <!-- Main Animated Hero Title -->
  <text x="600" y="170" text-anchor="middle" class="sans-text" font-size="54" font-weight="900" fill="url(#textShimmer)" letter-spacing="-1">
    TOP VIRAL REPOSITORIES
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="222" text-anchor="middle" class="sans-text" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
    The Definitive Open-Source Index of Trending AI Agents, Local LLMs &amp; Next-Gen DevTools
  </text>

  <!-- Decorative Animated Tech Circuit Line -->
  <g opacity="0.65">
    <line x1="300" y1="260" x2="900" y2="260" stroke="#334155" stroke-width="1.5"/>
    <line x1="450" y1="260" x2="750" y2="260" stroke="url(#borderGrad)" stroke-width="2.5">
      <animate attributeName="x1" values="350;550;350" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="650;850;650" dur="5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Feature Pill Tags -->
  <g transform="translate(600, 315)">
    <!-- Pill 1: AI Agents -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="0" y="6" text-anchor="middle" class="mono-text" font-size="13" font-weight="600" fill="#7dd3fc">🤖 AI AGENTS</text>
    </g>

    <!-- Pill 2: Local LLMs -->
    <g transform="translate(-120, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="0" y="6" text-anchor="middle" class="mono-text" font-size="13" font-weight="600" fill="#c7d2fe">⚡ LOCAL LLMs</text>
    </g>

    <!-- Pill 3: Enterprise RAG -->
    <g transform="translate(120, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="0" y="6" text-anchor="middle" class="mono-text" font-size="13" font-weight="600" fill="#e9d5ff">🔍 SMART RAG</text>
    </g>

    <!-- Pill 4: Privacy-First -->
    <g transform="translate(360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="10" fill="#0f172a" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="0" y="6" text-anchor="middle" class="mono-text" font-size="13" font-weight="600" fill="#fbcfe8">🛡️ PRIVACY FIRST</text>
    </g>
  </g>

  <!-- Bottom Interactive Pulse Dots -->
  <g transform="translate(600, 375)">
    <text x="0" y="0" text-anchor="middle" class="mono-text" font-size="12" font-weight="500" fill="#64748b" letter-spacing="1.5">
      ⭐ REAL-TIME STAR METRICS &amp; AUTOMATED TRACKING ⭐
    </text>
  </g>
</svg>
